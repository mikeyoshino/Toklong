services:
  postgres:
    image: postgres:17-alpine
    container_name: toklong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toklong
      POSTGRES_USER: toklong
      POSTGRES_PASSWORD: toklong_dev
    ports:
      - "5432:5432"
    volumes:
      - toklong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toklong -d toklong"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  toklong-postgres-data:
